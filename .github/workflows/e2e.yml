name: End-to-end

# Starts the stacks on the runner (a throwaway Docker host) with generated
# throwaway credentials, checks Postgres is healthy and every web UI answers
# through Traefik, then tears everything down. See scripts/e2e.sh. No secrets
# are used. pi-hole is skipped (port 53 is taken on the runner). Not a required
# check: path-filtered on PRs.
on:
  pull_request:
    paths:
      - stacks/**
      - template/**
      - .env.template
      - Makefile
      - scripts/e2e.sh
      - .github/workflows/e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Stacks up and reachable
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Run end-to-end script
        run: scripts/e2e.sh
