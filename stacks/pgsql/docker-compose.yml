services:
  postgresql:
    image: postgres:${POSTGRES_TAG}
    container_name: postgresql
    hostname: postgresql
    restart: unless-stopped
    # ports:
    #   - "5432:5432"
    networks:
      - control-plane
    volumes:
      - pgsql-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

networks:
  control-plane:
    external: true

volumes:
  pgsql-data:
    name: pgsql-data
